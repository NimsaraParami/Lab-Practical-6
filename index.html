<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <nav class="navbar">
        <div class="nav-container">
            <h2>Personal Expense Tracker</h2>
        </div>
    </nav>

    <main class="container">
        
        <header class="dashboard-header">
            <h1>Financial Dashboard</h1>
            <p>Manage your income and expenses in one place.</p>
        </header>

        
        <section class="summary-cards">
            <div class="card">
                <span class="card-title">Total Income</span>
                <h2 id="total-income">LKR 0.00</h2>
            </div>
            <div class="card">
                <span class="card-title">Total Expenses</span>
                <h2 id="total-expenses">LKR 0.00</h2>
            </div>
            <div class="card">
                <span class="card-title">Current Balance</span>
                <h2 id="current-balance">LKR 0.00</h2>
            </div>
        </section>

        
        <section class="card-panel">
            <h3>Add a Transaction</h3>
            <form id="transaction-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly allowance" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="any" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                    <button type="button" id="clear-btn" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </section>

        
        <section class="card-panel">
            <h3>Transaction History</h3>
            
            <div class="controls-grid">
                <div class="form-group">
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="search-input">Search Transactions</label>
                    <input type="text" id="search-input" placeholder="Search by description or category">
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
